services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dataton
      POSTGRES_PASSWORD: dataton
      POSTGRES_DB: dataton
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataton -d dataton"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
